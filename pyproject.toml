[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linxai"
version = "0.1.0"
description = "Offline-first Linux operations service and desktop application foundations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["PyYAML==6.0.3", "psutil==7.1.3"]

[project.optional-dependencies]
ai = ["requests==2.32.5"]
desktop = ["PySide6==6.10.0"]
remote = ["paramiko==4.0.0"]
hardware = ["numpy==2.2.6", "opencv-contrib-python==4.12.0.88"]
voice = ["faster-whisper==1.2.1", "webrtcvad-wheels==2.0.14", "sounddevice==0.5.3"]
# BCC is deliberately supplied by the sensor OS/interpreter, never PyPI's 'bcc'.
sensor = []

[project.scripts]
linxai = "operations.cli:main"
linxai-ops = "operations.cli:main"
linxai-agent = "operations.agent:main"
linxai-desktop = "ui.desktop:main"
linxai-monitor = "security.monitor:main"

[dependency-groups]
dev = ["uv==0.13.3"]
# All current tests use Python's pinned-runtime standard-library unittest.
test = []

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ai*", "cie*", "ebpf*", "executor*", "logger*", "operations*", "security*", "resources*", "system*", "ui*", "vps*"]
namespaces = true

[tool.setuptools.package-data]
ebpf = ["probes/*.c"]
executor = ["pam/*.c", "pam/*.sh"]

[tool.uv]
required-version = "==0.13.3"
default-groups = ["dev"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
