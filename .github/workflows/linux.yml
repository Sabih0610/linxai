name: Linux ordinary-user checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-and-unprivileged:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-02
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Isolated locked environment (no services/models/hardware)
        run: python scripts/setup_dev.py
      - name: Fast offline regression
        run: .venv/bin/python -B scripts/test.py offline
      - name: Native ordinary-user integration
        run: .venv/bin/python -B scripts/test.py linux
      - name: Optional groups report skipped unless explicitly opted in
        run: |
          .venv/bin/python -B scripts/test.py privileged
          .venv/bin/python -B scripts/test.py desktop
          .venv/bin/python -B scripts/test.py hardware
          .venv/bin/python -B scripts/test.py model
      - name: Passive capability report
        run: .venv/bin/python -B scripts/capabilities.py --output capabilities.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: capabilities-python-${{ matrix.python }}
          path: capabilities.json
