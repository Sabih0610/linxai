name: Linux ordinary-user checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-and-unprivileged:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-02
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Isolated locked environment (no services/models/hardware)
        run: python scripts/setup_dev.py
      - name: Integrated native checks and fresh installed agent workflow
        run: |
          .venv/bin/python -c "import subprocess,sys; code=subprocess.call([sys.executable,'-B','scripts/run_candidate.py','--offline','--report','candidate-acceptance.json']); raise SystemExit(0 if code in (0,3) else code)"
      - name: Package the exact committed source and protected components
        run: .venv/bin/python -B scripts/package_candidate.py --offline --output dist/candidate
      - name: Verify and execute the exact packaged wheel
        run: .venv/bin/python -B scripts/verify_candidate.py dist/candidate --report artifact-acceptance.json
      - name: Installed application and explicit root-refusal lab
        run: .venv/bin/python -B scripts/run_gate_a_lab.py --check-root-rejection --report gate-a-lab.json
      - name: Optional groups report skipped unless explicitly opted in
        run: |
          .venv/bin/python -B scripts/test.py privileged
          .venv/bin/python -B scripts/test.py desktop
          .venv/bin/python -B scripts/test.py hardware
          .venv/bin/python -B scripts/test.py model
      - name: Passive capability report
        run: .venv/bin/python -B scripts/capabilities.py --output capabilities.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: capabilities-python-${{ matrix.python }}
          path: |
            capabilities.json
            gate-a-lab.json
            candidate-acceptance.json
            artifact-acceptance.json
            dist/candidate/
